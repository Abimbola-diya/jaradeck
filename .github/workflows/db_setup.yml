name: Database Setup

on: [push]

jobs:
  setup-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Execute SQL
        env:
          DATABASE_URL: "postgresql://postgres:abimbola%402007db@db.yjzfotmjkziehsqvxito.supabase.co:5432/postgres"
        run: |
          # Use psql to execute the SQL string directly
          psql "$DATABASE_URL" -c "
          CREATE TABLE IF NOT EXISTS waitlist_submissions (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
              name TEXT NOT NULL,
              contact_selected JSONB NOT NULL,
              contacts JSONB NOT NULL,
              role TEXT NOT NULL,
              role_other TEXT,
              tasks_selected JSONB NOT NULL,
              tasks_other TEXT,
              frequency TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS newsletter_subscribers (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
              email TEXT UNIQUE NOT NULL
          );
          "
          echo "Tables created successfully."
